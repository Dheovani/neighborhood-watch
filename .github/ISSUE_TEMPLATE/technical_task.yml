name: Technical task
description: Propose an implementation or maintenance task within an approved milestone.
title: '[Tech] '
labels: []
body:
  - type: input
    id: milestone
    attributes:
      label: Approved milestone
      description: Reference docs/ROADMAP.md. An issue does not approve a new milestone.
      placeholder: M01
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Need and scope
      description: Describe the concrete problem and the work in scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results, including edge cases when relevant.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Name the build, automated test, or manual check that proves completion.
    validations:
      required: true
