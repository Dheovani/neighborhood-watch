name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore NeighborhoodWatch.csproj
      - name: Verify C# formatting
        run: dotnet format NeighborhoodWatch.csproj --verify-no-changes --no-restore --verbosity minimal
      - name: Build with warnings as errors
        run: dotnet build NeighborhoodWatch.csproj --configuration Release --no-restore --warnaserror

  game-smoke:
    name: Game smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install Godot 4.7.2 .NET
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot.zip"
          directory="$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip' \
            --output "$archive"
          echo '129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  '"$archive" | sha256sum --check
          mkdir -p "$directory"
          unzip -q "$archive" -d "$directory"
          godot="$(find "$directory" -type f -name 'Godot*_mono_linux.x86_64' -print -quit)"
          test -n "$godot"
          chmod +x "$godot"
          test "$("$godot" --version)" = '4.7.2.stable.mono.official.ed1daf0bf'
          echo "GODOT_EXE=$godot" >> "$GITHUB_ENV"
      - name: Restore and build game
        run: |
          dotnet restore NeighborhoodWatch.csproj
          dotnet build NeighborhoodWatch.csproj --configuration Debug --no-restore
      - name: Import project
        run: '"$GODOT_EXE" --headless --path "$GITHUB_WORKSPACE" --editor --import --quit'
      - name: Launch main scene
        run: '"$GODOT_EXE" --headless --path "$GITHUB_WORKSPACE" --quit-after 20'
      - name: Test movement and camera
        run: '"$GODOT_EXE" --headless --path "$GITHUB_WORKSPACE" --script res://tests/movement_smoke.gd'
