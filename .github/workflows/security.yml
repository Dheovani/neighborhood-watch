name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuget-audit:
    name: NuGet audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Fail on moderate or higher known package vulnerabilities
        run: |
          dotnet restore NeighborhoodWatch.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=moderate -warnaserror
          dotnet restore tests/NeighborhoodWatch.DomainChecks.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=moderate -warnaserror

  codeql:
    name: CodeQL C#
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@v4
